name: Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'version.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Read version
        id: version
        run: |
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          OUT_NAME="omnidrive-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" -o "$OUT_NAME" ./cmd/omnidrive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: omnidrive-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version
        id: version
        run: |
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          chmod +x android/build-apk.sh
          VERSION=${{ steps.version.outputs.version }} VERSION_CODE=${{ steps.version.outputs.code }} bash android/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-apk
          path: build/*.apk

  release:
    needs: [build, apk]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
