name: Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'version.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Read version
        id: version
        run: |
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" -o "omnidrive-windows-amd64.exe" ./cmd/omnidrive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-windows-amd64
          path: omnidrive-windows-amd64.exe

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version
        id: version
        run: |
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          chmod +x android/build-apk.sh
          VERSION=${{ steps.version.outputs.version }} VERSION_CODE=${{ steps.version.outputs.code }} bash android/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-apk
          path: build/*.apk

  release:
    needs: [windows, android]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
