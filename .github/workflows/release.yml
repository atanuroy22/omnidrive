name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o omnidrive${{ matrix.ext }} ./cmd/omnidrive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: omnidrive${{ matrix.ext }}

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-36"

      - name: Build APK
        run: |
          chmod +x android/build-apk.sh
          ANDROID_HOME=$ANDROID_SDK_ROOT VERSION=${{ github.ref_name }} bash android/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-android.apk
          path: build/*.apk

  release:
    needs: [build, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
